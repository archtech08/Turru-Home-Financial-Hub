<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #080b12;
    --panel:    #0d1420;
    --row:      #0a1018;
    --border:   #111e30;
    --border2:  #162030;
    --text:     #e0f0ff;
    --muted:    #6888bb;
    --green:    #00ffaa;
    --red:      #ff2255;
    --blue:     #6888bb;
    --limit-grey: #7d8290;
  }
  body { background: var(--bg); color: var(--text); font-family: "Inter", system-ui, sans-serif; font-size: 13px; min-height: 100vh; }
  select, input, button { font-family: inherit; }

  .header { border-bottom: 1px solid var(--border); padding: 20px 28px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
  .header .subtitle { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .header-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .save-indicator { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; transition: color 0.3s; margin-right: 4px; cursor: default; }
  .save-indicator.flash { color: var(--green); }
  .save-indicator.error { color: var(--red); cursor: pointer; }

  select { background: var(--panel); border: 1px solid var(--border2); color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 11px; cursor: pointer; outline: none; }
  select:hover { border-color: var(--muted); }

  .tab-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 6px 13px; cursor: pointer; font-size: 11px; text-transform: capitalize; transition: all 0.15s; }
  .tab-btn:hover { border-color: var(--muted); color: var(--text); }
  .tab-btn.active { background: var(--border2); border-color: var(--muted); color: var(--text); }

  .filter-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 5px 11px; cursor: pointer; font-size: 11px; transition: all 0.15s; }
  .filter-btn:hover { border-color: var(--muted); color: var(--text); }
  .filter-btn.active { background: var(--border2); border-color: var(--muted); color: var(--text); }

  .refresh-btn { background: transparent; border: 1px solid var(--border2); color: var(--muted); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px; line-height: 1; }
  .refresh-btn:hover { border-color: var(--muted); color: var(--text); }
  .refresh-btn.spinning { animation: spin 0.8s linear; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .body { padding: 20px 28px; }
  .filter-row { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-label { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; margin-right: 4px; }

  .exclude-pill { font-size: 11px; padding: 3px 10px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; user-select: none; }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .card-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 6px; }
  .card-value { font-size: 24px; font-weight: 500; letter-spacing: -0.5px; margin-bottom: 3px; }
  .card-sub { font-size: 11px; color: var(--muted); }

  .person-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .person-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 13px 16px; cursor: pointer; transition: border-color 0.15s; }
  .person-card:hover { border-color: var(--muted); }
  .person-card .name { font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
  .person-card .stats { display: flex; gap: 18px; }
  .person-card .stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 2px; }
  .person-card .stat-val { font-size: 13px; font-weight: 300; }

  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .chart-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .chart-panel.full { grid-column: 1 / -1; }
  .panel-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 14px; }
  .chart-wrap { position: relative; height: 220px; }
  .bar-wrap { position: relative; height: 280px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 10px; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); }
  .legend-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  .breakdown-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .breakdown-list { display: flex; flex-direction: column; gap: 9px; max-height: 500px; overflow-y: auto; }
  .breakdown-header { display: flex; justify-content: space-between; margin-bottom: 3px; font-size: 11px; }
  .breakdown-bar-bg { height: 4px; background: var(--border2); border-radius: 2px; }
  .breakdown-bar-fill { height: 100%; border-radius: 2px; }

  .tx-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .tx-toolbar { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .tx-count { margin-left: auto; font-size: 11px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  thead { position: sticky; top: 0; background: var(--panel); z-index: 1; }
  th { padding: 9px 13px; text-align: left; font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); font-weight: 400; border-bottom: 1px solid var(--border); }
  th.right { text-align: right; }
  td { padding: 8px 13px; border-bottom: 1px solid var(--row); font-size: 11px; }
  .tx-scroll { max-height: 520px; overflow-y: auto; }
  .tx-date { color: var(--muted); white-space: nowrap; }
  .tx-desc { color: var(--text); max-width: 220px; }
  .tx-amount { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }

  .pill { font-size: 10px; padding: 2px 7px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; user-select: none; white-space: nowrap; border: 1px solid transparent; }

  .budget-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .budget-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; }
  .budget-card.over { border-color: rgba(255,34,85,0.25); }
  .budget-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .budget-name { font-size: 12px; color: var(--text); }
  .budget-amounts { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .budget-spent { color: var(--text); }
  .budget-sep { color: var(--border2); }
  .budget-limit { color: var(--muted); cursor: default; }
  .budget-limit.set { color: var(--green); }
  .budget-bar-bg { height: 5px; background: var(--border2); border-radius: 3px; overflow: hidden; margin-bottom: 5px; }
  .budget-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .budget-footer { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }
  .budget-over-text { color: var(--red); }
  .budget-limit-text { color: var(--limit-grey); }
  .budget-note { font-size: 10px; color: var(--muted); margin-top: 14px; opacity: 0.7; }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 260px; color: var(--muted); text-align: center; gap: 8px; }
  .empty-state .big { font-size: 14px; color: var(--text); }
  .empty-state .small { font-size: 11px; max-width: 360px; }

  .banner { background: rgba(255,34,85,0.08); border: 1px solid rgba(255,34,85,0.3); color: #ff8fa8; border-radius: 8px; padding: 12px 16px; font-size: 12px; margin-bottom: 16px; line-height: 1.5; }
  .banner.warn { background: rgba(255,170,0,0.08); border-color: rgba(255,170,0,0.3); color: #ffcf8f; }
  .banner .row-item { color: #ffe0b3; }
  .banner code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px; }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Financial Overview</h1>
    <div class="subtitle" id="subtitle">Loading…</div>
  </div>
  <div class="header-right">
    <span class="save-indicator" id="saveIndicator" title="">connecting…</span>
    <button class="refresh-btn" id="refreshBtn" title="Refresh from sheet">⟳</button>
    <select id="monthSelect"></select>
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="breakdown">Breakdown</button>
    <button class="tab-btn" data-tab="transactions">Transactions</button>
    <button class="tab-btn" data-tab="budget">Budget</button>
  </div>
</div>

<div class="body">
  <div id="errorBanner"></div>
  <div id="warningBanner"></div>

  <div class="filter-row" id="personFilters"></div>

  <div class="filter-row" id="excludeRow">
    <span class="filter-label">Exclude:</span>
    <div id="excludedPills"></div>
    <select id="excludeSelect"><option value="">+ Exclude category</option></select>
    <button id="clearExclude" style="display:none; background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:11px; font-family:inherit; text-decoration:underline;">clear all</button>
  </div>

  <div class="cards" id="summaryCards"></div>
  <div class="person-cards" id="personCards" style="display:none"></div>

  <div id="view-overview"></div>
  <div id="view-breakdown" style="display:none"></div>
  <div id="view-transactions" style="display:none"></div>
  <div id="view-budget" style="display:none"></div>
</div>

<script>
/* ============================================================
   CONFIG — paste your published Google Sheet CSV link below.
   Google Sheet → File → Share → Publish to web → select the
   sheet/tab → format "Comma-separated values (.csv)" → Publish.
   Copy that link and paste it here between the quotes.
   ============================================================ */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTg_KMIWZwpAsrJ-NWh7ks0qJuqze7731tDwV43-l_ZQFjPm6oodAF-z6xbDvpCoS4T2HVS1KBCSfgn/pub?gid=2068590103&single=true&output=csv";

/* Publish your Budget tab the same way (File → Share → Publish to web →
   select the Budget sheet/tab → CSV) and paste that second link here. */
const BUDGET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTg_KMIWZwpAsrJ-NWh7ks0qJuqze7731tDwV43-l_ZQFjPm6oodAF-z6xbDvpCoS4T2HVS1KBCSfgn/pub?gid=1807882099&single=true&output=csv";

const REFRESH_INTERVAL_MS = 2 * 60 * 1000; // auto-refresh every 2 minutes

// ── Known category colors (kept from the original theme) ──
const C = {"Income":"#00ffaa","Wedding Income":"#00ffaa","Birthday Income":"#00ffaa","Misc Income":"#00ffaa","Groceries":"#00aaff","Costco":"#0088ff","Travel Food":"#ff6688","Solo Dining":"#ff4477","Dining Out":"#ff3366","Treat":"#ff7755","Date Night":"#ff44aa","Rent":"#ffaa00","Utilities":"#ff9900","Electricity":"#ff8800","Internet":"#ffbb00","Household":"#ffcc44","Medical":"#bb44ff","Fitness":"#aa33ff","Self Care":"#cc55ff","Wedding":"#ff44aa","Birthday":"#ee44cc","Gifts":"#dd33bb","Couples Outing":"#ff55cc","Gas":"#00eeff","Car Insurance":"#ff9944","Travel":"#00ddff","Subscriptions":"#7755ff","Professional Services":"#6644ee","Student Loan":"#5533dd","Amazon":"#8866ff","Misc":"#6888bb"};
// Fallback palette for any new category name not in the map above (no greens/reds — those are reserved for income/expense signals)
const FALLBACK_PALETTE = ["#00aaff","#ff6688","#ffaa00","#bb44ff","#ff44aa","#00eeff","#7755ff","#c2c9e4","#0088ff","#ff9944","#cc55ff","#8866ff"];
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = (h << 5) - h + s.charCodeAt(i); h |= 0; } return Math.abs(h); }
function colorForCategory(cat) { return C[cat] || FALLBACK_PALETTE[hashStr(cat) % FALLBACK_PALETTE.length]; }

// ── State ──
let state = {
  txs: [],
  loaded: false,
  lastSynced: null,
  error: null,
  month: "all",
  personFilter: "all",
  view: "overview",
  typeFilter: "all",
  excludedCats: [],
  budget: {},
};

function updateSyncIndicator() {
  const el = document.getElementById("saveIndicator");
  el.classList.remove("flash", "error");
  if (state.error) {
    el.textContent = "⚠ sync error — click to retry";
    el.classList.add("error");
    el.title = state.error;
  } else if (state.lastSynced) {
    el.textContent = "synced " + state.lastSynced.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    el.title = "Data pulled from your Google Sheet";
  } else {
    el.textContent = "connecting…";
  }
}

// ── Helpers ──
const fmt = n => "$" + Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
function hexAlpha(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function parseAmount(raw) {
  if (raw == null) return NaN;
  const s = String(raw).trim();
  if (!s) return NaN;
  // Accounting format: parentheses mean negative, e.g. "($45.20)"
  const isParenNegative = /\(.*\)/.test(s);
  const hasMinusSign = /^-/.test(s.replace(/[^0-9.\-]/g, ""));
  const cleaned = s.replace(/[^0-9.]/g, "");
  let val = parseFloat(cleaned);
  if (isNaN(val)) return NaN;
  if (isParenNegative || hasMinusSign) val = -Math.abs(val);
  return val;
}
function parseDateToISO(raw) {
  if (!raw) return null;
  const s = String(raw).trim();
  // Already ISO: YYYY-MM-DD
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  // US format: M/D/YYYY or M/D/YY
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) {
    let [, mo, d, y] = m;
    if (y.length === 2) y = "20" + y;
    return `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`;
  }
  const d2 = new Date(s);
  if (!isNaN(d2.getTime())) return d2.toISOString().slice(0,10);
  return null;
}
function monthLabel(ym) {
  if (ym === "all") return "All Months";
  if (ym === "last3") return "Last 3 Months";
  if (ym === "ytd") return "Year to Date";
  const [y, m] = ym.split("-");
  const names = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return `${names[parseInt(m,10)-1]} ${y}`;
}
// For "last3" / "ytd", compute an actual [start,end] date range based on the
// most recent transaction date present (so it still makes sense with sample data).
function computeQuickRange(period, txs) {
  if (!txs.length) return null;
  const maxDate = txs.map(t => t.date).sort().slice(-1)[0];
  if (period === "ytd") {
    return { start: maxDate.slice(0,4) + "-01-01", end: maxDate };
  }
  if (period === "last3") {
    let [y, m] = maxDate.slice(0,7).split("-").map(Number);
    m -= 2;
    while (m <= 0) { m += 12; y -= 1; }
    return { start: `${y}-${String(m).padStart(2,"0")}-01`, end: maxDate };
  }
  return null;
}
function inSelectedPeriod(t, txs) {
  if (state.month === "all") return true;
  if (state.month === "last3" || state.month === "ytd") {
    const range = computeQuickRange(state.month, txs);
    if (!range) return true;
    return t.date >= range.start && t.date <= range.end;
  }
  return t.date.startsWith(state.month);
}

async function fetchCsvRaw(url) {
  const bust = (url.includes("?") ? "&" : "?") + "cb=" + Date.now();
  const res = await fetch(url + bust, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return await res.text();
}

// Parses a CSV, locating the real header row by looking for one that contains
// all of requiredSubstrings (as substrings, case-insensitive) somewhere in its
// cells. This lets a sheet have title rows, blank rows, or notes above the
// actual table without breaking the import.
function rowMatchesHeader(normalizedCells, requiredSubstrings) {
  const usedIndices = new Set();
  for (const sub of requiredSubstrings) {
    const idx = normalizedCells.findIndex((cell, i) => !usedIndices.has(i) && cell.includes(sub));
    if (idx === -1) return false;
    usedIndices.add(idx);
  }
  return true;
}
function parseCsvFlexibleHeader(text, requiredSubstrings) {
  const rows = Papa.parse(text, { skipEmptyLines: true }).data; // array of arrays
  let headerIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    const normalized = rows[i].map(c => (c || "").toString().trim().toLowerCase());
    if (rowMatchesHeader(normalized, requiredSubstrings)) { headerIdx = i; break; }
  }
  if (headerIdx === -1) return [];
  const headers = rows[headerIdx].map(c => (c || "").toString().trim().toLowerCase());
  return rows.slice(headerIdx + 1).map(r => {
    const obj = {};
    headers.forEach((h, idx) => { if (h) obj[h] = r[idx]; });
    return obj;
  });
}

// ── Load data from Google Sheet(s) ──
async function loadData(isManualRefresh) {
  const btn = document.getElementById("refreshBtn");
  if (isManualRefresh && btn) btn.classList.add("spinning");

  const expensesConfigured = CSV_URL && CSV_URL.indexOf("PASTE_YOUR") !== 0;
  const budgetConfigured = BUDGET_CSV_URL && BUDGET_CSV_URL.indexOf("PASTE_YOUR") !== 0;

  if (!expensesConfigured) {
    state.error = "No sheet connected yet — paste your published Expenses CSV link into CSV_URL at the top of this file.";
    state.loaded = true;
    finishLoad(btn, isManualRefresh);
    return;
  }

  try {
    // Expenses
    const expText = await fetchCsvRaw(CSV_URL);
    const expRows = parseCsvFlexibleHeader(expText, ["date", "category", "amount"]);
    const txs = [];
    const skipped = [];
    let id = 1;
    for (const norm of expRows) {
      const rawDate = (norm.date || "").toString().trim();
      const rawAmount = (norm.amount || "").toString().trim();
      const category = (norm.category || "").toString().trim();
      const person = (norm.person || "").toString().trim() || "Unassigned";
      const desc = (norm.description || norm.desc || "").toString().trim();
      const hasAnyContent = rawDate || rawAmount || category || desc;
      if (!hasAnyContent) continue; // fully blank row — ignore silently

      const date = parseDateToISO(rawDate);
      const amount = parseAmount(rawAmount);
      const missing = [];
      if (!date) missing.push("date");
      if (isNaN(amount)) missing.push("amount");
      if (!category) missing.push("category");
      if (missing.length) {
        skipped.push({ date: rawDate || "?", desc: desc || "(no description)", missing });
        continue;
      }
      txs.push({ id: id++, date, desc, category, amount, person });
    }
    state.txs = txs;
    state.skippedRows = skipped;

    // Budget (optional — dashboard still works without it)
    if (budgetConfigured) {
      const budText = await fetchCsvRaw(BUDGET_CSV_URL);
      const budRows = parseCsvFlexibleHeader(budText, ["category", "budget"]);
      const hasPersonCol = budRows.some(r => Object.prototype.hasOwnProperty.call(r, "person"));
      const budgetByPerson = {}; // { category: { person: amount } }
      const budgetFlat = {};     // { category: amount }  — used if no Person column yet
      for (const norm of budRows) {
        const amtKey = Object.keys(norm).find(k => k.includes("budget"));
        const cat = (norm.category || "").toString().trim();
        const amt = amtKey ? parseAmount(norm[amtKey]) : NaN;
        if (!cat || isNaN(amt)) continue;
        if (/^total\b/i.test(cat)) continue; // skip summary rows like "Total Monthly Budget"
        if (hasPersonCol) {
          const person = (norm.person || "").toString().trim() || "Family";
          if (!budgetByPerson[cat]) budgetByPerson[cat] = {};
          budgetByPerson[cat][person] = (budgetByPerson[cat][person] || 0) + amt;
        } else {
          budgetFlat[cat] = amt;
        }
      }
      state.budgetByPerson = budgetByPerson;
      state.budgetFlat = budgetFlat;
      state.budgetHasPersonColumn = hasPersonCol;
      state.budgetError = null;
    } else {
      state.budgetError = "Budget tab not connected — paste your published Budget CSV link into BUDGET_CSV_URL to see shared budgets here.";
    }

    state.error = null;
    state.lastSynced = new Date();
    // On first successful load, default to the most recent month present
    if (!state._defaultedMonth && txs.length) {
      const months = [...new Set(txs.map(t => t.date.slice(0,7)))].sort().reverse();
      if (months.length) state.month = months[0];
      state._defaultedMonth = true;
    }
  } catch (e) {
    state.error = "Couldn't load the sheet (" + e.message + "). Check that the CSV link(s) are published and publicly viewable.";
  }
  state.loaded = true;
  finishLoad(btn, isManualRefresh);
}
function finishLoad(btn, isManualRefresh) {
  updateSyncIndicator();
  render();
  if (isManualRefresh && btn) setTimeout(() => btn.classList.remove("spinning"), 800);
}

function getFiltered() {
  return state.txs.filter(t => {
    if (!inSelectedPeriod(t, state.txs)) return false;
    if (state.personFilter !== "all" && t.person !== state.personFilter) return false;
    if (state.excludedCats.includes(t.category)) return false;
    return true;
  });
}
function getByCat(txs) {
  const a = {};
  txs.forEach(t => { a[t.category] = (a[t.category] || 0) + t.amount; });
  return a;
}
function getExpCats(byCat) {
  return Object.entries(byCat).filter(([,v]) => v < 0)
    .map(([cat, v]) => ({name: cat, value: Math.abs(v)})).sort((a,b) => b.value - a.value);
}
function getIncCats(byCat) {
  return Object.entries(byCat).filter(([,v]) => v > 0)
    .map(([cat, v]) => ({name: cat, value: v})).sort((a,b) => b.value - a.value);
}
// Resolves the budget target for a category, respecting the current person filter.
// If the Budget tab has a Person column: "all" sums every person's line for that
// category; a specific person only sees their own line (or 0 if unset).
// If there's no Person column yet, falls back to one shared number for everyone.
function getBudgetFor(category) {
  if (!state.budgetHasPersonColumn) {
    return (state.budgetFlat && state.budgetFlat[category]) || 0;
  }
  const perPerson = (state.budgetByPerson && state.budgetByPerson[category]) || {};
  if (state.personFilter === "all") {
    return Object.values(perPerson).reduce((s, v) => s + v, 0);
  }
  return perPerson[state.personFilter] || 0;
}

// ── Charts registry ──
const charts = {};
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

// ── Render ──
function render() {
  const errBanner = document.getElementById("errorBanner");
  errBanner.innerHTML = state.error
    ? `<div class="banner">${state.error}${(!CSV_URL || CSV_URL.indexOf("PASTE_YOUR")===0) ? "" : " The dashboard will keep retrying automatically."}</div>`
    : "";

  const warnBanner = document.getElementById("warningBanner");
  const skipped = state.skippedRows || [];
  if (skipped.length) {
    const items = skipped.slice(0, 5).map(r =>
      `<div class="row-item">• ${r.date} — ${r.desc} <em>(missing ${r.missing.join(", ")})</em></div>`
    ).join("");
    const more = skipped.length > 5 ? `<div class="row-item">+ ${skipped.length - 5} more</div>` : "";
    warnBanner.innerHTML = `<div class="banner warn">⚠ ${skipped.length} row${skipped.length > 1 ? "s" : ""} in your Expenses sheet ${skipped.length > 1 ? "are" : "is"} missing required info and won't show up until fixed:${items}${more}</div>`;
  } else {
    warnBanner.innerHTML = "";
  }

  const allCategories = [...new Set(state.txs.map(t => t.category))].sort();
  const people = [...new Set(state.txs.map(t => t.person))].sort();
  const months = [...new Set(state.txs.map(t => t.date.slice(0,7)))].sort().reverse();

  const filtered = getFiltered();
  const byCat = getByCat(filtered);
  const expCats = getExpCats(byCat);
  const incCats = getIncCats(byCat);
  const totInc = incCats.reduce((s,c) => s+c.value, 0);
  const totExp = expCats.reduce((s,c) => s+c.value, 0);
  const net = totInc - totExp;

  document.getElementById("subtitle").textContent = state.txs.length
    ? `${state.txs.length} transactions · synced from Google Sheets`
    : (state.loaded ? "No transactions yet — add rows to your Google Sheet to get started" : "Loading…");

  const ms = document.getElementById("monthSelect");
  const monthOptions = ["all", "last3", "ytd", ...months];
  ms.innerHTML = monthOptions.map(m => `<option value="${m}"${m===state.month?" selected":""}>${monthLabel(m)}</option>`).join("");

  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === state.view));

  const pf = document.getElementById("personFilters");
  pf.innerHTML = `<span class="filter-label">View:</span>
    <button class="filter-btn${state.personFilter==="all"?" active":""}" data-person="all">Everyone</button>
    ${people.map(p => `<button class="filter-btn${state.personFilter===p?" active":""}" data-person="${p}">${p}</button>`).join("")}`;

  const sel = document.getElementById("excludeSelect");
  sel.innerHTML = `<option value="">+ Exclude category</option>` +
    allCategories.filter(c => !state.excludedCats.includes(c)).map(c => `<option value="${c}">${c}</option>`).join("");
  const ep = document.getElementById("excludedPills");
  ep.innerHTML = state.excludedCats.map(cat => {
    const col = colorForCategory(cat);
    return `<span class="exclude-pill" data-cat="${cat}" style="background:${hexAlpha(col,0.15)};color:${col};border:1px solid ${hexAlpha(col,0.4)}">${cat} <span>✕</span></span>`;
  }).join("");
  document.getElementById("clearExclude").style.display = state.excludedCats.length ? "inline" : "none";

  const isBudgetView = state.view === "budget";
  let cardsHtml = "";
  if (!isBudgetView) {
    cardsHtml = [
      {label:"Total Income", value:fmt(totInc), color:"var(--text)", sub: incCats.length + " sources"},
      {label:"Total Expenses", value:fmt(totExp), color:"var(--text)", sub: expCats.length + " categories"},
      {label:"Net Balance", value:fmt(net), color: net>=0?"var(--green)":"var(--red)", sub: net>=0?"Surplus":"Deficit"},
    ].map(c => `<div class="card"><div class="card-label">${c.label}</div><div class="card-value" style="color:${c.color}">${c.value}</div><div class="card-sub">${c.sub}</div></div>`).join("");
  } else {
    const totalAllotted = expCats.reduce((s,c) => s+getBudgetFor(c.name), 0);
    const totalSpent = expCats.reduce((s,c) => s+c.value, 0);
    const remaining = totalAllotted - totalSpent;
    const catsSet = expCats.filter(c => getBudgetFor(c.name) > 0).length;
    cardsHtml = [
      {label:"Total Allotted", value:fmt(totalAllotted), color:"var(--blue)", sub: catsSet + " of " + expCats.length + " categories budgeted"},
      {label:"Total Spent", value:fmt(totalSpent), color:"var(--text)", sub: "across " + expCats.length + " categories"},
      {label: remaining>=0?"Remaining":"Over Budget", value:fmt(Math.abs(remaining)), color: remaining>=0?"var(--green)":"var(--red)", sub: remaining>=0?"left to spend":"over total budget"},
    ].map(c => `<div class="card"><div class="card-label">${c.label}</div><div class="card-value" style="color:${c.color}">${c.value}</div><div class="card-sub">${c.sub}</div></div>`).join("");
  }
  document.getElementById("summaryCards").innerHTML = cardsHtml;

  const pcEl = document.getElementById("personCards");
  if (state.personFilter === "all" && state.view !== "budget" && people.length) {
    const allTxs = state.txs.filter(t => inSelectedPeriod(t, state.txs));
    pcEl.style.display = "grid";
    pcEl.innerHTML = people.map(p => {
      let inc=0, exp=0;
      allTxs.filter(t=>t.person===p).forEach(t => { if(t.amount>0) inc+=t.amount; else exp+=Math.abs(t.amount); });
      return `<div class="person-card" data-person="${p}"><div class="name">${p}</div><div class="stats"><div><div class="stat-label">Income</div><div class="stat-val" style="color:var(--green)">${fmt(inc)}</div></div><div><div class="stat-label">Expenses</div><div class="stat-val" style="color:var(--text)">${fmt(exp)}</div></div></div></div>`;
    }).join("");
  } else { pcEl.style.display = "none"; }

  ["overview","breakdown","transactions","budget"].forEach(v => {
    document.getElementById("view-"+v).style.display = v === state.view ? "block" : "none";
  });

  if (!state.txs.length && state.loaded) {
    renderEmptyStates();
  } else if (state.view === "overview") renderOverview(expCats, incCats);
  else if (state.view === "breakdown") renderBreakdown(expCats, incCats);
  else if (state.view === "transactions") renderTransactions(filtered);
  else if (state.view === "budget") renderBudget(expCats);
}

function renderEmptyStates() {
  const msg = `<div class="empty-state"><div class="big">No transactions yet</div><div class="small">Add rows to your Google Sheet with Date, Description, Category, Amount, and Person columns. This dashboard checks for updates automatically.</div></div>`;
  document.getElementById("view-overview").innerHTML = msg;
  document.getElementById("view-breakdown").innerHTML = "";
  document.getElementById("view-transactions").innerHTML = "";
  document.getElementById("view-budget").innerHTML = "";
}

function renderOverview(expCats, incCats) {
  const el = document.getElementById("view-overview");
  el.innerHTML = `
    <div class="chart-grid">
      <div class="chart-panel"><div class="panel-title">Expenses by Category</div>
        <div class="chart-wrap"><canvas id="pieExp"></canvas></div>
        <div class="legend" id="legendExp"></div>
      </div>
      <div class="chart-panel"><div class="panel-title">Income by Source</div>
        <div class="chart-wrap"><canvas id="pieInc"></canvas></div>
        <div class="legend" id="legendInc"></div>
      </div>
      <div class="chart-panel full"><div class="panel-title">Top Spending Categories</div>
        <div class="bar-wrap"><canvas id="barTop"></canvas></div>
      </div>
    </div>`;

  ["Exp","Inc"].forEach(type => {
    destroyChart("pie"+type);
    const data = type==="Exp" ? expCats : incCats;
    if (!data.length) return;
    const ctx = document.getElementById("pie"+type).getContext("2d");
    charts["pie"+type] = new Chart(ctx, {
      type: "doughnut",
      data: { labels: data.map(d=>d.name), datasets: [{ data: data.map(d=>d.value), backgroundColor: data.map(d=>colorForCategory(d.name)), borderWidth: 0, hoverOffset: 4 }] },
      options: { cutout:"60%", plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => " " + fmt(ctx.raw) }, backgroundColor:"#0d1420", titleColor:"#e0f0ff", bodyColor:"#e0f0ff", borderColor:"#111e30", borderWidth:1 } }, animation:{duration:400} }
    });
    document.getElementById("legend"+type).innerHTML = data.slice(0,12).map(d =>
      `<div class="legend-item"><div class="legend-dot" style="background:${colorForCategory(d.name)}"></div>${d.name}</div>`).join("");
  });

  destroyChart("barTop");
  const top = expCats.slice(0,10);
  if (top.length) {
    const ctx = document.getElementById("barTop").getContext("2d");
    charts["barTop"] = new Chart(ctx, {
      type: "bar",
      data: { labels: top.map(d=>d.name), datasets: [{ data: top.map(d=>d.value), backgroundColor: top.map(d=>colorForCategory(d.name)), borderWidth: 0, borderRadius: 4 }] },
      options: { indexAxis:"y", plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => " " + fmt(ctx.raw) }, backgroundColor:"#0d1420", titleColor:"#e0f0ff", bodyColor:"#e0f0ff", borderColor:"#111e30", borderWidth:1 } }, scales:{ x:{ ticks:{color:"#6888bb",font:{size:10}}, grid:{color:"#111e30"}, border:{display:false}, callback: v => "$"+v }, y:{ ticks:{color:"#6888bb",font:{size:11}}, grid:{display:false}, border:{display:false} } }, animation:{duration:400} }
    });
  } else {
    document.getElementById("barTop").parentElement.innerHTML = `<div class="empty-state" style="height:160px"><div class="small">No expenses for this period</div></div>`;
  }
}

function renderBreakdown(expCats, incCats) {
  const el = document.getElementById("view-breakdown");
  function listHtml(data, accentColor) {
    if (!data.length) return "<p style='color:var(--muted);font-size:12px'>No data for this period.</p>";
    const max = data[0].value;
    return data.map(c => `
      <div class="breakdown-row">
        <div class="breakdown-header">
          <span style="color:var(--text)">${c.name}</span>
          <span style="color:${accentColor}">${fmt(c.value)}</span>
        </div>
        <div class="breakdown-bar-bg">
          <div class="breakdown-bar-fill" style="width:${(c.value/max*100).toFixed(1)}%;background:${colorForCategory(c.name)}"></div>
        </div>
      </div>`).join("");
  }
  el.innerHTML = `<div class="breakdown-grid">
    <div class="chart-panel"><div class="panel-title">All Expense Categories</div><div class="breakdown-list">${listHtml(expCats,"var(--text)")}</div></div>
    <div class="chart-panel"><div class="panel-title">All Income Sources</div><div class="breakdown-list">${listHtml(incCats,"var(--green)")}</div></div>
  </div>`;
}

function renderTransactions(filtered) {
  const el = document.getElementById("view-transactions");
  const shown = filtered.filter(t => {
    if (state.typeFilter === "income") return t.amount > 0;
    if (state.typeFilter === "expense") return t.amount < 0;
    return true;
  }).sort((a,b) => b.date.localeCompare(a.date));

  const rows = shown.map(t => {
    const col = colorForCategory(t.category);
    return `<tr>
      <td class="tx-date">${t.date.slice(5).replace("-","/")} / ${t.date.slice(0,4)}</td>
      <td class="tx-desc">${t.desc}</td>
      <td><span class="pill" style="background:${hexAlpha(col,0.15)};color:${col};border-color:${hexAlpha(col,0.35)}">${t.category}</span></td>
      <td><span class="pill" style="background:${hexAlpha("#6888bb",0.15)};color:#6888bb;border-color:${hexAlpha("#6888bb",0.35)}">${t.person}</span></td>
      <td class="tx-amount">${t.amount>0?"+":""}${fmt(t.amount)}</td>
    </tr>`;
  }).join("");

  el.innerHTML = `<div class="tx-panel">
    <div class="tx-toolbar">
      <span class="filter-label">Show:</span>
      ${["all","income","expense"].map(f=>`<button class="filter-btn${state.typeFilter===f?" active":""}" data-type="${f}">${f}</button>`).join("")}
      <span class="tx-count">${shown.length} transactions · edit rows in your Google Sheet</span>
    </div>
    <div class="tx-scroll">
      <table>
        <thead><tr>
          <th>Date</th><th>Description</th><th>Category</th><th>Person</th><th class="right">Amount</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

function renderBudget(expCats) {
  const el = document.getElementById("view-budget");
  const monthL = monthLabel(state.month);
  const who = state.personFilter === "all" ? "everyone" : state.personFilter;

  if (state.budgetError) {
    el.innerHTML = `<div class="empty-state"><div class="small">${state.budgetError}</div></div>`;
    return;
  }
  if (!expCats.length) {
    el.innerHTML = `<div class="empty-state"><div class="small">No expense categories for this period yet.</div></div>`;
    return;
  }

  // Compute status for each category, then sort green → yellow → grey (tapped out) → red → no budget set.
  // Ties within a group keep the original spend-descending order.
  const BUDGET_EPSILON = 0.005; // half a cent, to treat "spent == budget" as exact despite float rounding
  const withStatus = expCats.map(c => {
    const bud = getBudgetFor(c.name);
    const pct = bud > 0 ? Math.min((c.value/bud)*100, 100) : 0;
    const over = bud > 0 && c.value > bud + BUDGET_EPSILON;
    const atLimit = bud > 0 && !over && c.value >= bud - BUDGET_EPSILON; // spent it all, $0 left, not yet over
    const warn = bud > 0 && !over && !atLimit && pct >= 80;
    const rank = bud <= 0 ? 4 : (over ? 3 : (atLimit ? 2 : (warn ? 1 : 0))); // 0=green,1=yellow,2=grey,3=red,4=no budget
    return { ...c, bud, pct, over, atLimit, warn, rank };
  });
  withStatus.sort((a, b) => a.rank - b.rank);

  const cards = withStatus.map(c => {
    const { bud, pct, over, atLimit, warn } = c;
    const barColor = over ? "var(--red)" : atLimit ? "var(--limit-grey)" : warn ? "#ffaa00" : "var(--green)";
    const remaining = Math.max(0, bud - c.value);
    return `<div class="budget-card${over?" over":""}">
      <div class="budget-header">
        <span class="budget-name">${c.name}</span>
        <div class="budget-amounts">
          <span class="budget-spent">${fmt(c.value)}</span>
          <span class="budget-sep">/</span>
          <span class="budget-limit${bud>0?" set":""}" title="Set in the Budget tab of your Google Sheet">${bud>0?fmt(bud):"no budget set"}</span>
        </div>
      </div>
      <div class="budget-bar-bg"><div class="budget-bar-fill" style="width:${bud>0?pct.toFixed(1):0}%;background:${barColor}"></div></div>
      <div class="budget-footer">
        <span>${bud>0?Math.round(pct)+"% used":"no budget set"}</span>
        ${bud>0?`<span class="${over?"budget-over-text":(atLimit?"budget-limit-text":"")}">${over?fmt(Math.abs(bud - c.value))+" over":(atLimit?"$0.00 left":fmt(remaining)+" left")}</span>`:""}
      </div>
    </div>`;
  }).join("");

  const personNote = state.budgetHasPersonColumn
    ? (state.personFilter === "all"
        ? "Totals below add up every person's budget line for each category."
        : `Showing budgets set specifically for ${state.personFilter}.`)
    : "Add a Person column to your Budget tab to set separate budgets per person — right now every person shares one number per category.";

  el.innerHTML = `
    <p style="font-size:11px;color:var(--muted);margin-bottom:14px">
      Showing <span style="color:var(--text)">${who}</span> · <span style="color:var(--text)">${monthL}</span>. Budgets come from the Budget tab of your Google Sheet.
    </p>
    <div class="budget-grid">${cards}</div>
    <p class="budget-note">${personNote} To change a budget, edit the Budget tab in your Sheet — it'll show up here within a couple of minutes.</p>`;
}

// ── Events ──
document.addEventListener("click", e => {
  if (e.target.classList.contains("tab-btn")) { state.view = e.target.dataset.tab; render(); return; }
  if (e.target.dataset.person) { state.personFilter = e.target.dataset.person; render(); return; }
  if (e.target.closest(".person-card") && !e.target.dataset.person) { state.personFilter = e.target.closest(".person-card").dataset.person; render(); return; }
  if (e.target.dataset.type) { state.typeFilter = e.target.dataset.type; render(); return; }
  if (e.target.closest(".exclude-pill")) { const cat = e.target.closest(".exclude-pill").dataset.cat; state.excludedCats = state.excludedCats.filter(c=>c!==cat); render(); return; }
  if (e.target.id === "clearExclude") { state.excludedCats = []; render(); return; }
  if (e.target.id === "refreshBtn") { loadData(true); return; }
  if (e.target.id === "saveIndicator" && state.error) { loadData(true); return; }
});

document.getElementById("monthSelect").addEventListener("change", e => { state.month = e.target.value; render(); });
document.getElementById("excludeSelect").addEventListener("change", e => {
  const cat = e.target.value;
  if (cat && !state.excludedCats.includes(cat)) { state.excludedCats.push(cat); render(); }
});

// ── Init ──
loadData(false);
setInterval(() => loadData(false), REFRESH_INTERVAL_MS);
</script>
</body>
</html>
